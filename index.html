<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جولات المرافق والصيانة الوقائية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#eef1f3;--sf:#fff;--ink:#14232e;--mu:#5d6c78;--ln:#d5dce1;--ac:#0b5fa5;--ok:#1f7a4d;--wn:#9a5b00;--bd:#b8321f;--okb:#e1f2e8;--wnb:#fcefd3;--bdb:#fadfda;--na:#e3e8eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--sf:#17252f;--ink:#e6edf2;--mu:#9aabb8;--ln:#2a3b47;--ac:#6ab3ee;--ok:#4cc38a;--wn:#f0b24b;--bd:#ff8a7a;--okb:#14332a;--wnb:#3a2e12;--bdb:#3b1d1a;--na:#22323d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22;--sf:#17252f;--ink:#e6edf2;--mu:#9aabb8;--ln:#2a3b47;--ac:#6ab3ee;--ok:#4cc38a;--wn:#f0b24b;--bd:#ff8a7a;--okb:#14332a;--wnb:#3a2e12;--bdb:#3b1d1a;--na:#22323d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
main{max-width:1040px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 10px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.mu{color:var(--mu);font-size:14px}
nav{display:flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:4px}
nav button{border:0;background:none;color:var(--ink);font:inherit;padding:8px 14px;border-radius:7px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pr{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.gh{background:none;border:1px solid var(--ln);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.banner{background:var(--wnb);color:var(--wn);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
.sum{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:14px}
.sum div{font-size:14px;color:var(--mu)}.sum b{display:block;font-size:34px;line-height:1.1;color:var(--ink)}
.sum .bd b{color:var(--bd)}.sum .wn b{color:var(--wn)}.sum .ok b{color:var(--ok)}
.map .g{display:flex;gap:10px;align-items:center;margin:6px 0}
.map .gl{width:110px;font-size:13px;color:var(--mu);flex:none}
.map .ts{display:flex;flex-wrap:wrap;gap:4px}
.t{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid}
.t.ok{background:var(--okb);color:var(--ok);border-color:var(--ok)}.t.wn{background:var(--wnb);color:var(--wn);border-color:var(--wn)}.t.bd{background:var(--bdb);color:var(--bd);border-color:var(--bd)}.t.na{background:var(--na);color:var(--mu);border-color:var(--ln)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.cols{grid-template-columns:1fr}.map .g{flex-direction:column;align-items:flex-start;gap:2px}}
.al{list-style:none;margin:0;padding:0}
.al li{padding:8px 10px;border-radius:7px;margin-bottom:6px;font-size:15px;border-inline-start:5px solid}
.al .s2{background:var(--bdb);border-color:var(--bd)}.al .s1{background:var(--wnb);border-color:var(--wn)}
.sec{margin-bottom:14px}.sec>h2{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.row .nm{font-weight:500;min-width:150px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;color:var(--mu);font:inherit;font-size:14px;padding:7px 12px;cursor:pointer;border-inline-start:1px solid var(--ln)}
.seg button:first-child{border:0}
.seg button.on.ok{background:var(--okb);color:var(--ok);font-weight:700}.seg button.on.wn{background:var(--wnb);color:var(--wn);font-weight:700}.seg button.on.bd{background:var(--bdb);color:var(--bd);font-weight:700}
.num{display:flex;flex-direction:column;font-size:12px;color:var(--mu)}
.num input{width:120px;font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink)}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:12px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:15px}
.wrap{overflow-x:auto}
th,td{text-align:start;padding:9px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font-weight:500;color:var(--mu);font-size:13px}
.pb{width:140px;height:10px;background:var(--na);border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle}
.pb i{display:block;height:100%}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.wn{background:var(--wnb);color:var(--wn)}.chip.bd{background:var(--bdb);color:var(--bd)}
td input{width:76px;font:inherit;padding:4px 6px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink)}
.empty{text-align:center;padding:50px 10px}
.toast{position:fixed;inset-inline:0;bottom:70px;margin:auto;width:fit-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:9}
svg text{fill:var(--mu);font-family:inherit}
.form{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin-bottom:14px}
.fh{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 18px;background:#0b3a5f;color:#fff}
.ft{font-size:20px;font-weight:700}.fh .mu{color:rgba(255,255,255,.8)}
.fm{text-align:end;font-size:13px}.fm b{display:block;font-size:16px;direction:ltr}
.fg{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--ln)}
.fg label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);padding:10px 14px;border-inline-end:1px solid var(--ln)}
.fg input,.fg select,.fg b{font:inherit;font-size:15px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--ln);padding:4px 0;width:100%}
.fp{padding:10px 18px;border-bottom:1px solid var(--ln);display:flex;gap:14px;align-items:center;font-size:14px;flex-wrap:wrap}
.fs>h3{margin:0;padding:8px 18px;background:var(--na);font-size:15px;display:flex;justify-content:space-between;gap:10px}
.ct th{background:var(--bg)}.ct td{padding:6px 8px;vertical-align:middle}
.ct td input[data-f]{width:100px}
.ct td small{display:block;font-size:11px;color:var(--mu)}
.cd{font-family:ui-monospace,Consolas,monospace;color:var(--mu);font-size:13px;direction:ltr;text-align:end}
.rb{background:var(--bdb)}
.ct td input.nt{width:100%;min-width:170px}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:34px 18px 20px}
.sig div{border-top:1px solid var(--ink);padding-top:6px;font-size:13px;color:var(--mu);text-align:center}
@media(max-width:760px){.fg{grid-template-columns:1fr 1fr}.sig{grid-template-columns:1fr}}
.gs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.gs button{border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;padding:9px 16px;border-radius:8px;cursor:pointer}.gs button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.tin{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px dashed currentColor;width:100%;padding:2px 0}.ft .tin{font-size:20px;font-weight:700;width:340px;max-width:100%}
.ed{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.ed select,.ed input{font:inherit;font-size:12px;padding:3px 4px;border:1px solid var(--ln);border-radius:5px;background:var(--bg);color:var(--ink);width:auto}.ed input{width:70px}.ed .gh{padding:2px 8px;font-size:12px}
.tech #sub,.tech [data-em]{display:none!important}
@media print{.gs,nav,.bar,.banner,.toast,.top .mu{display:none!important}body{background:#fff;color:#000}.form{border:0}.fs{break-inside:avoid}.seg button:not(.on){display:none}.wrap{overflow:visible}}

/* ===== CMMS hero section (added) ===== */
.cmms{--cm-bg:#020D24;--cm-blue:#1e7bff;--cm-cyan:#4fc3ff;position:relative;overflow:hidden;isolation:isolate;direction:ltr;margin-bottom:14px;border-radius:14px;border:1px solid #11306b;background:var(--cm-bg);color:#fff;font-family:"Montserrat","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
.cmms[hidden]{display:none}
.cmms::before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(55% 70% at 50% 52%,rgba(24,92,220,.34),transparent 72%),radial-gradient(40% 55% at 92% 18%,rgba(0,140,255,.20),transparent 70%),radial-gradient(35% 45% at 6% 92%,rgba(20,70,190,.22),transparent 70%),linear-gradient(180deg,#031236 0%,#020D24 60%,#010818 100%)}
.cmms::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(70,150,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(70,150,255,.08) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(75% 75% at 50% 50%,#000 20%,transparent 100%);mask-image:radial-gradient(75% 75% at 50% 50%,#000 20%,transparent 100%)}
.cmms-hex{position:absolute;top:0;bottom:0;right:0;width:50%;z-index:-1;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 45%);mask-image:linear-gradient(90deg,transparent 0,#000 45%)}
.cmms-hex svg{width:100%;height:100%;display:block}
.cmms-stage{position:relative;width:min(100%,640px);margin:0 auto;padding:clamp(8px,2.5vw,26px)}
.cmms-stage svg{display:block;width:100%;height:auto;overflow:visible}
.cmms text{font-family:"Montserrat","Segoe UI",Arial,sans-serif;fill:#fff}
.cm-spin{transform-box:view-box;transform-origin:300px 300px;animation:cm-rot 80s linear infinite;will-change:transform}
.cm-spin.rev{animation-duration:130s;animation-direction:reverse}
.cm-pulse{animation:cm-pulse 4.5s ease-in-out infinite}
.cm-pulse.d2{animation-delay:-2.2s}
.cm-float{animation:cm-float 6s ease-in-out infinite;will-change:transform}
.cm-node:nth-of-type(2) .cm-float{animation-delay:-1.5s}
.cm-node:nth-of-type(3) .cm-float{animation-delay:-3s}
.cm-node:nth-of-type(4) .cm-float{animation-delay:-4.5s}
.cm-node{cursor:pointer;outline:none}
.cm-halo{opacity:.38;transition:opacity .35s ease}
.cm-badge{fill:#05194a;stroke:#2f8cff;stroke-width:2;transition:stroke .3s ease,fill .3s ease}
.cm-ico{fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s ease}
.cm-node:hover .cm-halo,.cm-node:focus-visible .cm-halo{opacity:1}
.cm-node:hover .cm-badge,.cm-node:focus-visible .cm-badge{stroke:#8fd6ff;fill:#08256a}
.cm-hexa{animation:cm-drift 38s ease-in-out infinite alternate;will-change:transform}
.cm-hexb{animation:cm-drift2 52s ease-in-out infinite alternate;will-change:transform}
@keyframes cm-rot{to{transform:rotate(360deg)}}
@keyframes cm-pulse{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes cm-float{0%,100%{transform:translateY(-4px)}50%{transform:translateY(5px)}}
@keyframes cm-drift{from{transform:translate(0,0)}to{transform:translate(-14px,18px)}}
@keyframes cm-drift2{from{transform:translate(0,0)}to{transform:translate(12px,-16px)}}
@media(max-width:760px){.cmms-hex{width:80%;opacity:.55}.cmms-stage{padding:10px}}
@media(prefers-reduced-motion:reduce){.cmms *{animation:none!important}}
@media print{.cmms{display:none!important}}

/* ===== CMMS theme (system-wide) ===== */
html:root,html:root:not([data-theme="light"]),html:root[data-theme="dark"],html:root[data-theme="light"]{
--bg:#020D24;--sf:rgba(7,26,70,.62);--ink:#e8f1ff;--mu:#8fa9d4;--ln:#1a458f;--ac:#3b9cff;
--ok:#3be3a0;--wn:#ffc04d;--bd:#ff6b6b;--okb:rgba(30,200,140,.14);--wnb:rgba(255,184,60,.14);--bdb:rgba(255,80,90,.16);--na:rgba(40,90,180,.22);
--cm-glow:0 0 0 1px rgba(59,156,255,.18),0 0 22px rgba(30,123,255,.18);color-scheme:dark}
body{background:#020D24;position:relative;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(60% 50% at 50% 0%,rgba(24,92,220,.30),transparent 70%),radial-gradient(40% 40% at 100% 40%,rgba(0,140,255,.14),transparent 70%),radial-gradient(40% 40% at 0% 100%,rgba(20,70,190,.20),transparent 70%),linear-gradient(180deg,#031236,#020D24 55%,#010818)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(70,150,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(70,150,255,.06) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(80% 80% at 50% 30%,#000 10%,transparent 100%);mask-image:radial-gradient(80% 80% at 50% 30%,#000 10%,transparent 100%)}
h1{font-weight:700;letter-spacing:.2px;text-shadow:0 0 18px rgba(59,156,255,.55)}
h2{color:#fff}
.mu{color:var(--mu)}
nav{background:rgba(7,26,70,.7);border:1px solid #1d4fa8;box-shadow:var(--cm-glow);border-radius:999px;padding:4px}
nav button{border-radius:999px;color:#bcd2f5;transition:background .25s,color .25s,box-shadow .25s}
nav button:hover{color:#fff;background:rgba(59,156,255,.16)}
nav button.on{background:linear-gradient(135deg,#1e7bff,#4fc3ff);color:#02122f;box-shadow:0 0 16px rgba(79,195,255,.6)}
.pr{background:linear-gradient(135deg,#1e7bff,#2fa7ff);color:#fff;box-shadow:0 0 16px rgba(47,167,255,.45);transition:box-shadow .25s,transform .25s}
.pr:hover{box-shadow:0 0 26px rgba(79,195,255,.8);transform:translateY(-1px)}
.gh{border-color:#1d4fa8;color:#cfe0ff;background:rgba(10,40,100,.35);transition:border-color .25s,box-shadow .25s,color .25s}
.gh:hover{border-color:#4fc3ff;color:#fff;box-shadow:0 0 14px rgba(79,195,255,.4)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #4fc3ff;outline-offset:2px;box-shadow:0 0 12px rgba(79,195,255,.6)}
.panel,.form,.row{background:var(--sf);border:1px solid var(--ln);box-shadow:var(--cm-glow);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.panel,.form{border-radius:14px}
.banner{background:rgba(255,184,60,.12);border:1px solid rgba(255,184,60,.35);color:#ffd27d;border-radius:10px}
.sum div{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 18px;min-width:130px;box-shadow:var(--cm-glow)}
.sum b{color:#fff;text-shadow:0 0 14px rgba(79,195,255,.6)}
.sum .bd b{color:var(--bd);text-shadow:0 0 14px rgba(255,107,107,.55)}.sum .wn b{color:var(--wn);text-shadow:0 0 14px rgba(255,192,77,.5)}.sum .ok b{color:var(--ok);text-shadow:0 0 14px rgba(59,227,160,.5)}
.t{border-radius:7px;transition:box-shadow .2s,transform .2s}
.t:hover{transform:scale(1.15)}
.t.ok{box-shadow:0 0 8px rgba(59,227,160,.35)}.t.wn{box-shadow:0 0 8px rgba(255,192,77,.35)}.t.bd{box-shadow:0 0 10px rgba(255,107,107,.5)}
.al li{border-radius:8px}
.sec>h2{background:linear-gradient(180deg,#020D24 70%,rgba(2,13,36,0))}
.seg{border-color:#1d4fa8;background:rgba(5,20,60,.6)}
.seg button{color:#9db8e6;border-inline-start-color:#1d4fa8;transition:background .2s,color .2s}
.seg button:hover{color:#fff;background:rgba(59,156,255,.14)}
.seg button.on.ok{box-shadow:inset 0 0 12px rgba(59,227,160,.25)}.seg button.on.wn{box-shadow:inset 0 0 12px rgba(255,192,77,.25)}.seg button.on.bd{box-shadow:inset 0 0 12px rgba(255,107,107,.3)}
.num input,td input,.fg input,.fg select,.ed select,.ed input{background:rgba(3,16,48,.85);color:var(--ink);border-color:#1d4fa8;border-radius:6px}
.fg input,.fg select{border-radius:0}
.num input:focus,td input:focus,.ct td input:focus{border-color:#4fc3ff}
input::placeholder{color:#5f7fb3}
select option{background:#06194a;color:#e8f1ff}
.fh{background:linear-gradient(120deg,#082a6b,#0b4fb5 60%,#0a6fd8);box-shadow:0 0 26px rgba(30,123,255,.35)}
.ft{text-shadow:0 0 14px rgba(255,255,255,.35)}
.fg,.fp,.fg label{border-color:var(--ln)}
.fs>h3{background:linear-gradient(90deg,rgba(30,100,220,.35),rgba(30,100,220,.10));color:#fff;border-top:1px solid var(--ln)}
.ct th,th{background:rgba(5,22,64,.75);color:#8fb4ee}
th,td{border-bottom-color:rgba(26,69,143,.65)}
tr:hover>td{background:rgba(59,156,255,.06)}
.rb{background:var(--bdb)}
.pb{background:rgba(40,90,180,.28);box-shadow:inset 0 0 6px rgba(0,0,0,.4)}
.pb i{box-shadow:0 0 10px currentColor}
.chip{border:1px solid currentColor}
.sig div{border-top-color:#4a78c4}
.gs button{background:rgba(10,40,100,.4);border-color:#1d4fa8;color:#cfe0ff;border-radius:999px;transition:box-shadow .25s}
.gs button:hover{box-shadow:0 0 14px rgba(79,195,255,.4)}
.gs button.on{background:linear-gradient(135deg,#1e7bff,#4fc3ff);color:#02122f;border-color:transparent;box-shadow:0 0 16px rgba(79,195,255,.55)}
.bar{background:linear-gradient(0deg,#020D24 65%,rgba(2,13,36,0))}
.toast{background:#0b3a85;color:#fff;border:1px solid #4fc3ff;box-shadow:0 0 22px rgba(79,195,255,.5)}
svg text{fill:#9db8e6}
svg rect[fill="var(--ac)"]{fill:url(#cm-bar)}
.cd{color:#7fa3de}
.empty h2{text-shadow:0 0 14px rgba(79,195,255,.4)}
::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:#1d4fa8;border-radius:6px}::-webkit-scrollbar-track{background:#041033}
@media print{
html:root,html:root:not([data-theme="light"]),html:root[data-theme="dark"]{--bg:#fff;--sf:#fff;--ink:#000;--mu:#444;--ln:#bbb;--ac:#0b5fa5;--ok:#1f7a4d;--wn:#9a5b00;--bd:#b8321f;--okb:#e1f2e8;--wnb:#fcefd3;--bdb:#fadfda;--na:#e3e8eb}
body::before,body::after{display:none}
.panel,.form,.row,.sum div{box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.fh{background:#0b3a5f;box-shadow:none}.fs>h3{background:#e3e8eb;color:#000}.ct th,th{background:#fff;color:#444}
.num input,td input,.fg input,.fg select{background:#fff;color:#000}svg text{fill:#444}h1{text-shadow:none}
}
dialog#loginDlg{border:1px solid #2a63c4;border-radius:14px;background:#06194a;color:#e8f1ff;padding:20px 22px;width:min(92vw,360px);box-shadow:0 0 40px rgba(30,123,255,.5);direction:rtl}
dialog#loginDlg::backdrop{background:rgba(1,8,24,.75)}
@media print{#authBtn{display:none!important}}
.done-ov{position:fixed;inset:0;z-index:9999;background:rgba(2,10,30,.9);display:flex;align-items:center;justify-content:center;padding:16px;animation:doneIn .25s ease}
@keyframes doneIn{from{opacity:0}to{opacity:1}}
.done-box{max-width:520px;width:100%;text-align:center;color:#fff}
.done-box img{width:100%;height:auto;border-radius:16px;display:block;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.done-box p{font-weight:700;font-size:18px;margin:14px 0 10px}

<script>
const S=[
['المرافق',[['عداد الكهرباء','r','kWh',1],['عداد الميه','r','م³',1]]],
['المولد',[['المولد','s'],['سولار المولد','r','لتر'],['مفاتيح المولد الداخلية','s']]],
['الطلمبات',[['طلمبات الميه 1','s'],['طلمبات الميه 2','s'],['طلمبات الميه 3','s'],['طلمبة الوكى','sr','بار'],['طلمبة الكهرباء','sr','بار'],['طلمبة الديزيل','sr','بار'],['طلمبة الغاطس','s']]],
['لوحات الفاير',[['اللوحة الرئيسية','sa'],['لوحة البرج القديم','sa'],['لوحة البرج الجديد','sa']]],
['زونات الحريق (1 إلى 8)',['زون 1','زون 2','زون 3','البرج القديم زون 1','البرج القديم زون 2','البرج القديم زون 3','زون 4','زون 5','البرج الجديد زون 1','البرج الجديد زون 2','البرج الجديد زون 3','زون 6','زون 7','زون 8'].map(n=>[n,'f'])],
['زونات الحريق (من 9)',['البرج الجديد زون 4','البرج الجديد زون 5','البرج الجديد زون 6','زون 9','زون 10','زون 11'].map(n=>[n,'f'])],
['الأسانسيرات',[['أسانسير البرج القديم','s'],['أسانسير البرج الجديد','s']]],
['الريتش ترك',[['ريتش نون (Yale)','sh'],['ريتش ايجار (Finet)','sh']]],
['مكن التغليف',[...['52635','52636','53545'].map(n=>['مكنة بابل NAF '+n,'s']),...['34857','27255','51820'].map(n=>['مكنة فقاعة FAR '+n,'s'])]],
['المعدات',[['صابر 1','sh'],['صابر 4','sh'],['حميده 1','sh'],...[1,2,3,4,5].map(i=>['Yale '+i,'sh']),['فورك الكهرباء Noon','sh'],['حضان جديد','s']]],
['الهاند باليت',[...[['1','F'],['2','F'],['3','F'],['4','Y'],['5','Y'],['6','Flex'],['7','Flex']].map(a=>['هاند باليت '+a[0]+' (Noon - '+a[1]+')','s'])]]
];
const IT=[];S.forEach((s,i)=>s[1].forEach((x,j)=>IT.push({id:i+'_'+j,sec:s[0],n:x[0],k:x[1],u:x[2]||'',cum:x[3],code:['UT','GN','PM','FA','FZ','FB','EL','RT','PK','EQ','HP'][i]+'-'+String(j+1).padStart(2,'0'),g:['المعدات','الهاند باليت'].includes(s[0])?'B':'A'})));
const opts=it=>it.k=='f'?['طبيعي','إنذار','عطل']:['سليم','متوقف','عطل'];
const sev=v=>v=='عطل'?'bd':(v=='متوقف'||v=='إنذار')?'wn':v?'ok':'na';
const sym={ok:'✓',wn:'!',bd:'✕',na:'–'};
const ld=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const T=ld(new Date()),dayOf=n=>ld(new Date(Date.now()+n*864e5));
const fd=k=>new Date(k+'T12:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
const KEY='fm-rounds-v2';let DB=null;
try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const persist=()=>{if(CL){if(ADM)saveCfg();return}try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
function seed(){const d={},ppm={},c={};
IT.forEach(it=>{c[it.id]=it.u=='kWh'?48000:it.u=='م³'?5200:it.u=='لتر'?800:it.u=='بار'?7:200+Math.floor(Math.random()*1800)});
for(let i=8;i>=1;i--){const r={};IT.forEach(it=>{const v={};
v.s=Math.random()<.03?'عطل':opts(it)[0];
if(it.k.includes('h')){c[it.id]+=Math.round((5+Math.random()*5)*10)/10;v.h=c[it.id]}
if(it.k.includes('r')){c[it.id]+=it.u=='kWh'?300+Math.round(Math.random()*60):it.u=='م³'?12+Math.round(Math.random()*5):(it.u=='بار'?0:-(20+Math.round(Math.random()*10)));v.r=c[it.id]}
if(it.k.includes('a'))v.a=Math.random()<.1?1:0;r[it.id]=v});d[dayOf(-i)]=r}
IT.filter(it=>it.k.includes('h')).forEach(it=>ppm[it.id]={iv:250,last:Math.round(c[it.id]-Math.random()*270)});
return{days:d,ppm,demo:true}}
if(!DB||!DB.days)DB=seed();
DB.nm=DB.nm||{};const SN=S.map(s=>s[0]),PG={A:'',B:''};IT.forEach(it=>{it.n0=it.n;it.k0=it.k;it.u0=it.u;it.g0=it.g});const BASE=IT.slice();DB.hide=DB.hide||{};DB.cfg=DB.cfg||{};DB.custom=DB.custom||[];DB.csec=DB.csec||[];DB.cn=DB.cn||0;const NB=S.length;DB.csec.forEach(n=>{S.push([n,[]]);SN.push(n)});
function rebuild(){IT.length=0;const cu=DB.custom.map(c=>({id:c.id,sec:'',n:c.n,k:c.k,u:c.u||'',cum:0,code:'',g:c.g,n0:c.n,k0:c.k,u0:c.u||'',g0:c.g}));[...BASE,...cu].forEach(it=>{const c=DB.cfg[it.id]||{},ci=+it.id.split('_')[0];it.n=DB.nm[it.id]||it.n0;it.k=c.k||it.k0;it.u=c.u!==undefined?c.u:it.u0;it.g=c.g||it.g0;it.sec=S[ci][0];if(!it.code)it.code='CU-'+it.id.split('_')[1].toUpperCase();if(!DB.hide[it.id])IT.push(it)})}
function applyNames(){S.forEach((s,i)=>{s[0]=DB.nm['s'+i]||SN[i]});rebuild();PG.A=DB.nm.pgA||'قرائات cfc3';PG.B=DB.nm.pgB||'عدد ساعات المعدات cfc4'}
applyNames();
const days=()=>Object.keys(DB.days).sort();
const latest=()=>days().slice(-1)[0];
function prevOf(id,f,before){for(const k of days().filter(k=>k<before).reverse()){const v=DB.days[k][id];if(v&&v[f]!==undefined&&v[f]!==''&&v[f]!==null)return v[f]}return null}
const curH=id=>prevOf(id,'h','9999');
function P(id){const cur=curH(id);if(!DB.ppm[id])DB.ppm[id]={iv:250,last:cur||0};return DB.ppm[id]}
const FT=/[?&]tech=1/.test(location.search);let V='d',draft={},G='A',EM=false,ADM=!FT,CL=null,ct=0;
function initDraft(){draft=JSON.parse(JSON.stringify(DB.days[T]||{}));IT.forEach(it=>{const v=draft[it.id]||(draft[it.id]={});if(!v.s)v.s=opts(it)[0]});if(!draft._m)draft._m={sh:'صباحي',tech:'',sup:''}}
function ppmRows(){return IT.filter(it=>it.k.includes('h')).map(it=>{const cur=curH(it.id),p=P(it.id),used=cur==null?null:cur-p.last;return{it,cur,p,used,ratio:used==null?0:used/p.iv}}).sort((a,b)=>b.ratio-a.ratio)}
/* ===== تحليل القراءات + لوحة المؤشرات ===== */
const isFire=it=>it.k=='f'||/الفاير|الحريق/.test(it.sec);
const series=(id,f)=>days().map(k=>{const v=(DB.days[k][id]||{})[f];return[k,(v===''||v==null||isNaN(+v))?null:+v]}).filter(x=>x[1]!==null);
const gap=(a,b)=>Math.max(1,Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5));
const med=a=>{if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const fmt=n=>n==null||isNaN(n)?'—':Math.abs(n)>=100?Math.round(n).toLocaleString('en'):String(Math.round(n*10)/10);
function anoms(){const list=[];let n=0;
IT.forEach(it=>['r','h'].forEach(f=>{if(!it.k.includes(f))return;
const sr=series(it.id,f);if(sr.length<2)return;n++;
const cum=f=='h'||!!it.cum,un=f=='h'?'ساعة':(it.u||''),what=f=='h'?'التشغيل':'الاستهلاك';
if(cum){const rt=[];for(let i=1;i<sr.length;i++)rt.push({r:(sr[i][1]-sr[i-1][1])/gap(sr[i-1][0],sr[i][0]),neg:sr[i][1]<sr[i-1][1]});
const Lr=rt[rt.length-1],pa=sr[sr.length-2][1],pb=sr[sr.length-1][1];
if(Lr.neg){list.push({it,sv:2,tag:'↓ أقل من اللي قبلها',l1:'القراءة اللي قبلها',l2:'آخر قراءة',base:pa,cur:pb,un,txt:it.n+': '+(f=='h'?'ساعات التشغيل':'القراءة')+' أقل من اللي قبلها ('+fmt(pa)+' ← '+fmt(pb)+')، راجعها'});return}
if(f=='h'&&Lr.r>24.5){list.push({it,sv:2,tag:'أكتر من 24 ساعة/يوم',l1:'أقصى معدل',l2:'آخر معدل',base:24,cur:Lr.r,un:'ساعة/يوم',txt:it.n+': ساعات التشغيل زادت '+fmt(Lr.r)+' ساعة في اليوم الواحد، راجعها'});return}
const prev=rt.slice(0,-1).filter(x=>!x.neg).slice(-7).map(x=>x.r);if(!prev.length)return;
const base=med(prev);if(base<=0)return;if(f=='h'&&base<1&&Lr.r<1)return;
const ratio=Lr.r/base,pct=Math.round((ratio-1)*100),u2=un+'/يوم';
