<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>نظام إدارة مهام الفنيين</title>
  <style>
    :root{
      --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;
      --primary:#1d4ed8;--primary2:#2563eb;--danger:#dc2626;
      --success:#15803d;--warning:#b45309;--border:#e4e7ec;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Tahoma",sans-serif}
    .container{max-width:1180px;margin:auto;padding:22px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{font-size:24px;font-weight:800}
    .sub{color:var(--muted);font-size:13px;margin-top:5px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 5px 18px rgba(16,24,40,.05);margin-bottom:18px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    @media(max-width:760px){.grid,.grid3{grid-template-columns:1fr}.container{padding:12px}.brand{font-size:19px}}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font:inherit}
    textarea{min-height:95px;resize:vertical}
    input:focus,select:focus,textarea:focus{outline:2px solid rgba(37,99,235,.15);border-color:var(--primary2)}
    button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}
    .btn{background:var(--primary);color:#fff}.btn:hover{background:#1e40af}
    .btn.secondary{background:#eef2ff;color:#1e3a8a}.btn.gray{background:#eef0f3;color:#344054}
    .btn.danger{background:#fee2e2;color:#991b1b}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
    .hidden{display:none!important}
    .login{max-width:600px;margin:7vh auto}
    .tabs{display:flex;gap:8px;margin-bottom:16px}
    .tab{flex:1;background:#f2f4f7;color:#344054}
    .tab.active{background:#dbeafe;color:#1d4ed8}
    .alert{padding:11px 13px;border-radius:10px;margin:10px 0;font-size:14px}
    .alert.error{background:#fef3f2;color:#b42318}.alert.ok{background:#ecfdf3;color:#027a48}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
    .section-title h2,.section-title h3{margin:0}
    .task-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    @media(max-width:900px){.task-list{grid-template-columns:1fr}}
    .task{border:1px solid var(--border);border-radius:14px;padding:15px;background:#fff}
    .task h3{margin:0 0 7px;font-size:17px}
    .task p{margin:7px 0;color:#475467;line-height:1.6}
    .meta{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
    .badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#f2f4f7;color:#475467}
    .badge.high{background:#fee4e2;color:#b42318}.badge.medium{background:#fff3cd;color:#92400e}
    .badge.low{background:#eaf7ee;color:#166534}.badge.pending{background:#eef2ff;color:#3730a3}
    .badge.progress{background:#e0f2fe;color:#075985}.badge.support{background:#fff7ed;color:#9a3412}.badge.done{background:#ecfdf3;color:#166534}
    .file-list{margin:8px 0;padding-right:18px}.file-list li{margin:5px 0}
    a{color:#175cd3;text-decoration:none}a:hover{text-decoration:underline}
    .required{color:#b42318}
    .spinner{display:inline-block;width:15px;height:15px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    .table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:820px}
    .table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:right;font-size:13px;vertical-align:top}
    .table th{background:#f8fafc}
    .small{font-size:12px;color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}
    .modal-card{background:#fff;border-radius:16px;max-width:850px;width:100%;max-height:92vh;overflow:auto;padding:20px}
    .kv{display:grid;grid-template-columns:150px 1fr;gap:8px;margin:7px 0}.kv b{color:#344054}
    .file-box{border:1px dashed #98a2b3;border-radius:10px;padding:10px;background:#f8fafc}
    .loading{opacity:.6;pointer-events:none}
  </style>
</head>
<body>
<div class="container">
  <div id="app"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const state = { role:null, technician:null, tasks:[], selectedTask:null };

function run(fn, ...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e))[fn](...args);
  });
}
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function fmtDate(v){
  if(!v) return '-';
  const d = new Date(v);
  if(isNaN(d)) return esc(v);
  return d.toLocaleString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function badge(status){
  const s=String(status||'');
  let c=s==='Completed'?'done':s==='In Progress'?'progress':s==='Need Support'?'support':'pending';
  return `<span class="badge ${c}">${esc(s)}</span>`;
}
function priorityBadge(p){
  const c=p==='High'?'high':p==='Medium'?'medium':'low';
  return `<span class="badge ${c}">${esc(p)}</span>`;
}
function showError(msg){
  const el=$('alert');
  if(el){el.className='alert error';el.textContent=msg;el.classList.remove('hidden');}
  else alert(msg);
}
function showOk(msg){
  const el=$('alert');
  if(el){el.className='alert ok';el.textContent=msg;el.classList.remove('hidden');}
}
function clearAlert(){ if($('alert')) $('alert').classList.add('hidden'); }

function loginScreen(){
  $('app').innerHTML=`
    <div class="login card">
      <div style="text-align:center;margin-bottom:18px">
        <div class="brand">نظام إدارة مهام الفنيين</div>
        <div class="sub">Google Apps Script + Google Sheets + Google Drive</div>
      </div>
      <div id="alert" class="alert hidden"></div>
      <div class="tabs">
        <button id="techTab" class="tab active" onclick="switchLogin('tech')">دخول الفني</button>
        <button id="adminTab" class="tab" onclick="switchLogin('admin')">دخول الأدمن</button>
      </div>
      <div id="techLogin">
        <label>اسم الفني</label>
        <select id="techName"><option>جاري التحميل...</option></select>
        <div class="small" style="margin-top:7px">يظهر هنا فقط الفنيون Active وليس لديهم Week Off اليوم.</div>
        <div class="actions"><button class="btn" onclick="doTechLogin()">دخول</button></div>
      </div>
      <div id="adminLogin" class="hidden">
        <label>Admin PIN</label>
        <input id="adminPin" type="password" placeholder="أدخل PIN الأدمن">
        <div class="small" style="margin-top:7px">غيّر الـ PIN من دالة setAdminPin في Apps Script بعد أول تشغيل.</div>
        <div class="actions"><button class="btn" onclick="doAdminLogin()">دخول الأدمن</button></div>
      </div>
    </div>`;
  loadTechLogin();
}
function switchLogin(type){
  $('techLogin').classList.toggle('hidden',type!=='tech');
  $('adminLogin').classList.toggle('hidden',type!=='admin');
  $('techTab').classList.toggle('active',type==='tech');
  $('adminTab').classList.toggle('active',type==='admin');
  clearAlert();
}
async function loadTechLogin(){
  try{
    const names=await run('getTechniciansForLogin');
    $('techName').innerHTML=names.length?names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join(''):'<option value="">لا يوجد فني متاح اليوم</option>';
  }catch(e){showError(e.message||e);}
}
async function doTechLogin(){
  clearAlert();
  const name=$('techName').value;
  if(!name){showError('اختار اسم الفني.');return}
  try{
    const res=await run('technicianLogin',name);
    state.role=res.role;state.technician=res.technician;
    technicianHome();
  }catch(e){showError(e.message||e);}
}
async function doAdminLogin(){
  clearAlert();
  try{
    const res=await run('adminLogin',$('adminPin').value);
    state.role=res.role;
    adminHome();
  }catch(e){showError(e.message||e);}
}

function shell(title,subtitle){
  $('app').innerHTML=`
    <div class="topbar">
      <div><div class="brand">${esc(title)}</div><div class="sub">${esc(subtitle||'')}</div></div>
      <button class="btn gray" onclick="logout()">تسجيل خروج</button>
    </div>
    <div id="alert" class="alert hidden"></div>
    <div id="content"></div>`;
}
function logout(){state.role=null;state.technician=null;state.tasks=[];state.selectedTask=null;loginScreen();}

async function technicianHome(){
  shell('مهامي','الفني: '+state.technician);
  $('content').innerHTML=`
    <div class="card">
      <div class="section-title"><h2>My Tasks</h2><button class="btn secondary" onclick="loadMyTasks()">تحديث</button></div>
      <div id="taskList">جاري تحميل التاسكات...</div>
    </div>`;
  await loadMyTasks();
}
async function loadMyTasks(){
  const el=$('taskList'); if(!el)return;
  el.innerHTML='جاري التحميل...';
  try{
    state.tasks=await run('getMyTasks',state.technician);
    if(!state.tasks.length){el.innerHTML='<div class="small">لا توجد Tasks حالياً.</div>';return}
    el.innerHTML='<div class="task-list">'+state.tasks.map(t=>taskCard(t,false)).join('')+'</div>';
  }catch(e){showError(e.message||e);}
}
function taskCard(t,admin){
  return `<div class="task">
    <div class="section-title">
      <h3>${esc(t.title)}</h3>
      ${priorityBadge(t.priority)}
    </div>
    <div class="meta">${badge(t.status)}<span class="badge">ID: ${esc(t.taskId)}</span></div>
    <p>${esc(t.description||'لا يوجد وصف')}</p>
    <div class="small">الفني: ${esc(t.technician)} · الإنشاء: ${fmtDate(t.createdAt)}</div>
    ${t.taskFiles?.length?`<div><b>Task Files</b><ul class="file-list">${t.taskFiles.map((u,i)=>`<li><a href="${esc(u)}" target="_blank">فتح الملف ${i+1}</a></li>`).join('')}</ul></div>`:''}
    <div class="actions">
      <button class="btn" onclick="openTask('${esc(t.taskId)}',${admin})">فتح التاسك</button>
      ${admin?`<button class="btn secondary" onclick="adminStatus('${esc(t.taskId)}')">تغيير Status</button>`:''}
    </div>
  </div>`;
}

async function openTask(id,admin){
  clearAlert();
  try{
    const t=await run('getTask',id,admin?'':state.technician);
    state.selectedTask=t;
    const startBtn=(t.status==='Pending'||t.status==='Need Support')&&!admin?`<button class="btn" onclick="startSelected()">Start / Accept Task</button>`:'';
    const completeBtn=(t.status!=='Completed'&&!admin)?`<button class="btn" onclick="completionForm()">Complete Task / Report</button>`:'';
    const files=t.taskFiles?.length?`<ul class="file-list">${t.taskFiles.map((u,i)=>`<li><a href="${esc(u)}" target="_blank">فتح Task File ${i+1}</a></li>`).join('')}</ul>`:'<div class="small">لا توجد ملفات مرتبطة بالتاسك.</div>';
    $('app').insertAdjacentHTML('beforeend',`
      <div class="modal" id="taskModal" onclick="if(event.target===this)closeModal()">
        <div class="modal-card">
          <div class="section-title"><h2>${esc(t.title)}</h2><button class="btn gray" onclick="closeModal()">إغلاق</button></div>
          <div class="kv"><b>Task ID</b><span>${esc(t.taskId)}</span></div>
          <div class="kv"><b>Task Title</b><span>${esc(t.title)}</span></div>
          <div class="kv"><b>Task Description</b><span>${esc(t.description||'-')}</span></div>
          <div class="kv"><b>Technician</b><span>${esc(t.technician)}</span></div>
          <div class="kv"><b>Priority</b><span>${priorityBadge(t.priority)}</span></div>
          <div class="kv"><b>Status</b><span>${badge(t.status)}</span></div>
          <div class="kv"><b>Created Date & Time</b><span>${fmtDate(t.createdAt)}</span></div>
          <div class="kv"><b>Completed Date & Time</b><span>${fmtDate(t.completedAt)}</span></div>
          <div style="margin-top:12px"><b>Task Files</b>${files}</div>
          <div class="actions">${startBtn}${completeBtn}</div>
        </div>
      </div>`);
  }catch(e){showError(e.message||e);}
}
function closeModal(){const m=$('taskModal');if(m)m.remove();}
async function startSelected(){
  try{
    await run('startTask',state.selectedTask.taskId,state.technician);
    closeModal();await loadMyTasks();showOk('تم استلام التاسك وبدأ العمل عليه.');
  }catch(e){showError(e.message||e);}
}

function completionForm(){
  const t=state.selectedTask;
  closeModal();
  $('app').insertAdjacentHTML('beforeend',`
    <div class="modal" id="completeModal">
      <div class="modal-card">
        <div class="section-title"><h2>إكمال التاسك / التقرير</h2><button class="btn gray" onclick="closeComplete()">إلغاء</button></div>
        <div class="alert ok">Task #${esc(t.taskId)} — ${esc(t.title)}</div>
        <div class="grid">
          <div>
            <label>Work Done <span class="required">*</span></label>
            <textarea id="workDone" placeholder="اكتب ما تم عمله بالتفصيل"></textarea>
          </div>
          <div>
            <label>Materials / Tools Used <span class="required">*</span></label>
            <textarea id="materials" placeholder="اكتب الخامات أو العدد المستخدمة"></textarea>
          </div>
          <div>
            <label>Before File <span class="required">*</span></label>
            <div class="file-box"><input id="beforeFiles" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"></div>
          </div>
          <div>
            <label>After File <span class="required">*</span></label>
            <div class="file-box"><input id="afterFiles" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"></div>
          </div>
        </div>
        <div style="margin-top:14px">
          <label>Need Support <span class="required">*</span></label>
          <select id="needSupport" onchange="toggleSupport()"><option value="">اختر...</option><option value="No">No</option><option value="Yes">Yes</option></select>
        </div>
        <div id="supportWrap" class="hidden" style="margin-top:14px">
          <label>Support Required <span class="required">*</span></label>
          <textarea id="supportRequired" placeholder="محتاج Support في إيه؟"></textarea>
        </div>
        <div class="small" style="margin-top:12px">كل الحقول المطلوبة هنا إجبارية. إذا اخترت Yes سيظل التاسك بحالة Need Support إلى أن يتم حله.</div>
        <div class="actions"><button id="submitComplete" class="btn" onclick="submitCompletion()">إرسال التقرير</button></div>
      </div>
    </div>`);
}
function closeComplete(){const m=$('completeModal');if(m)m.remove();}
function toggleSupport(){$('supportWrap').classList.toggle('hidden',$('needSupport').value!=='Yes');}

async function filesToPayload(input){
  const files=[...(input.files||[])];
  const out=[];
  for(const file of files){
    if(file.size>10*1024*1024) throw new Error('الملف '+file.name+' أكبر من 10 MB.');
    const data=await new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload=()=>resolve(String(r.result).split(',')[1]||'');
      r.onerror=reject;r.readAsDataURL(file);
    });
    out.push({name:file.name,mimeType:file.type,data});
  }
  return out;
}
async function submitCompletion(){
  clearAlert();
  const btn=$('submitComplete');
  try{
    const workDone=$('workDone').value.trim();
    const materials=$('materials').value.trim();
    const needSupport=$('needSupport').value;
    const supportRequired=$('supportRequired').value.trim();
    if(!workDone||!materials||!needSupport) throw new Error('من فضلك أكمل كل الحقول الإجباري.');
    if(needSupport==='Yes'&&!supportRequired) throw new Error('Support Required إجباري عند اختيار Yes.');
    btn.disabled=true;btn.innerHTML='<span class="spinner"></span> جاري الرفع...';
    const beforeFiles=await filesToPayload($('beforeFiles'));
    const afterFiles=await filesToPayload($('afterFiles'));
    if(!beforeFiles.length) throw new Error('Before File إجباري.');
    if(!afterFiles.length) throw new Error('After File إجباري.');
    const res=await run('completeTask',{
      taskId:state.selectedTask.taskId,
      technician:state.technician,
      workDone,materials,needSupport,supportRequired,
      beforeFiles,afterFiles
    });
    closeComplete();
    await loadMyTasks();
    alert('تم إرسال التقرير بنجاح. Report ID: '+res.reportId+(needSupport==='Yes'?' — الحالة Need Support.':''));
  }catch(e){
    btn.disabled=false;btn.textContent='إرسال التقرير';
    showError(e.message||e);
  }
}

/* =========================
   Admin
   ========================= */
async function adminHome(){
  shell('لوحة الأدمن','إدارة التاسكات والتقييم الشهري');
  $('content').innerHTML=`
    <div class="grid3">
      <div class="card"><h3>إنشاء Task</h3><p class="small">إسناد Task لأي فني، حتى في Week Off.</p><button class="btn" onclick="showCreateTask()">إنشاء Task</button></div>
      <div class="card"><h3>كل Tasks</h3><p class="small">عرض ومتابعة كل التاسكات الحالية.</p><button class="btn secondary" onclick="showAllTasks()">فتح Tasks</button></div>
      <div class="card"><h3>Rating</h3><p class="small">حساب التقييم الشهري.</p><button class="btn secondary" onclick="showRating()">فتح Rating</button></div>
    </div>
    <div id="adminPanel"></div>`;
  showAllTasks();
}
async function showAllTasks(){
  const p=$('adminPanel');if(!p)return;
  p.innerHTML='<div class="card">جاري تحميل Tasks...</div>';
  try{
    const tasks=await run('getAllTasks');
    p.innerHTML=`<div class="card">
      <div class="section-title"><h2>كل Tasks</h2><button class="btn secondary" onclick="showAllTasks()">تحديث</button></div>
      <div class="task-list">${tasks.map(t=>taskCard(t,true)).join('')}</div>
    </div>`;
  }catch(e){showError(e.message||e);}
}
async function showCreateTask(){
  const p=$('adminPanel');
  const techs=await run('getTechniciansForAdmin');
  p.innerHTML=`<div class="card">
    <div class="section-title"><h2>إنشاء Task جديدة</h2><button class="btn gray" onclick="showAllTasks()">رجوع</button></div>
    <div class="grid">
      <div><label>Task Title <span class="required">*</span></label><input id="newTitle"></div>
      <div><label>Technician <span class="required">*</span></label><select id="newTech">${techs.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}${t.effectiveActive?'':' — No Active / Week Off'}</option>`).join('')}</select></div>
      <div><label>Priority <span class="required">*</span></label><select id="newPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
      <div><label>Task Files</label><input id="newFiles" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"><div class="small">الصور أو الملفات المرتبطة بالتاسك.</div></div>
    </div>
    <div style="margin-top:14px"><label>Task Description</label><textarea id="newDesc"></textarea></div>
    <div class="actions"><button id="createBtn" class="btn" onclick="createTaskAdmin()">حفظ Task</button></div>
  </div>`;
}
async function createTaskAdmin(){
  const btn=$('createBtn');
  try{
    const title=$('newTitle').value.trim(),desc=$('newDesc').value.trim(),technician=$('newTech').value,priority=$('newPriority').value;
    if(!title||!technician)throw new Error('Task Title و Technician إجباريان.');
    btn.disabled=true;btn.innerHTML='<span class="spinner"></span> جاري الحفظ...';
    const files=await filesToPayload($('newFiles'));
    const res=await run('createTask',{title,description:desc,technician,priority,files});
    showOk('تم إنشاء Task #'+res.task.taskId+' بنجاح.');
    showAllTasks();
  }catch(e){btn.disabled=false;btn.textContent='حفظ Task';showError(e.message||e);}
}
async function adminStatus(id){
  const status=prompt('اكتب Status: Pending / In Progress / Need Support / Completed');
  if(!status)return;
  try{await run('adminUpdateTaskStatus',id,status.trim());showAllTasks();}catch(e){showError(e.message||e);}
}

async function showRating(){
  const p=$('adminPanel');
  p.innerHTML=`<div class="card">
    <div class="section-title"><h2>Monthly Rating</h2><button class="btn gray" onclick="showAllTasks()">رجوع</button></div>
    <div class="grid3">
      <div><label>Month</label><input id="ratingMonth" type="month" value="${new Date().toISOString().slice(0,7)}"></div>
      <div style="display:flex;align-items:end"><button class="btn" onclick="loadRating()">حساب / تحديث Rating</button></div>
    </div>
    <div id="ratingTable" style="margin-top:18px">اختار الشهر ثم اضغط حساب / تحديث.</div>
  </div>`;
  loadRating();
}
async function loadRating(){
  try{
    const month=$('ratingMonth').value;
    const rows=await run('refreshMonthlyRating',month);
    $('ratingTable').innerHTML=`<div class="table-wrap"><table class="table">
      <thead><tr><th>Month</th><th>Technician</th><th>Total Tasks</th><th>Completed</th><th>Late / Uncompleted</th><th>Attendance Days</th><th>Attendance Score</th><th>Task Score</th><th>Final Rating</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td>${esc(r.month)}</td><td>${esc(r.technician)}</td><td>${r.totalTasks}</td><td>${r.completedTasks}</td>
        <td>${r.lateUncompletedTasks}</td><td>${r.attendanceDays}</td><td>${r.attendanceScore}</td><td>${r.taskScore}</td><td><b>${r.finalRating}</b></td>
      </tr>`).join('')}</tbody></table></div>`;
  }catch(e){showError(e.message||e);}
}
